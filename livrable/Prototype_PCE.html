<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certification PCE · Processus Créatif Éthique</title>
<style>
:root {
  --marine: #023481; --marine-f: #01275F; --encre: #1F2530; --gris: #666666; --gris-c: #9A9A9A;
  --trait: #BBBBBB; --trait-c: #DDE3EC; --pale: #E8EEF8; --fond: #F6F8FB; --blanc: #FFFFFF;
  --vert: #18753C; --vert-p: #E3F3E8; --rouge: #C9191E; --rouge-p: #FBE6E6; --orange: #B34000; --orange-p: #FDEEDF;
  --police: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --r: 2px; --ombre: 0 6px 24px rgba(2, 52, 129, .10);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: var(--police); color: var(--encre); background: var(--blanc); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--marine); }
img { max-width: 100%; }
h1, h2, h3, h4 { color: var(--marine); margin: 0 0 12px; line-height: 1.2; }
h1 { font-size: 40px; } h2 { font-size: 26px; } h3 { font-size: 18px; } h4 { font-size: 15px; }
p { margin: 0 0 12px; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid #2E6BFF; outline-offset: 2px; }
.conteneur { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* En-tête */
.entete { position: sticky; top: 0; z-index: 40; background: var(--blanc); border-bottom: 3px solid var(--marine); }
.entete .conteneur { display: flex; align-items: center; gap: 24px; height: 76px; }
.marque { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--marine); flex: none; }
.marque img { width: 52px; height: 52px; border-radius: 50%; }
.marque b { display: block; font-size: 18px; }
.marque small { display: block; font-size: 13px; color: var(--gris); }
.nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.nav a { color: var(--encre); text-decoration: none; font-size: 14px; padding: 8px 9px; position: relative; white-space: nowrap; }
.nav a.btn { color: var(--blanc); padding: 10px 16px; }
.nav a.btn::after { display: none; }
.nav a::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: 2px; height: 2px; background: var(--marine); transform: scaleX(0); transition: transform .25s; }
.nav a:hover::after, .nav a.actif::after { transform: scaleX(1); }
.nav a.actif { color: var(--marine); font-weight: 700; }
.nav .pro { color: var(--gris); border-left: 1px solid var(--trait-c); margin-left: 6px; }
.menu-btn { display: none; margin-left: auto; border: 1.5px solid var(--marine); background: var(--blanc); color: var(--marine); font-weight: 700; padding: 6px 10px; cursor: pointer; }

/* Boutons */
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; font: 700 15px var(--police); border: 1.5px solid var(--marine); background: var(--marine); color: var(--blanc); text-decoration: none; cursor: pointer; border-radius: var(--r); transition: background .2s, transform .15s, box-shadow .2s; }
.btn:hover { background: var(--marine-f); box-shadow: var(--ombre); }
.btn:active { transform: translateY(1px); }
.btn.sec { background: var(--blanc); color: var(--marine); }
.btn.sec:hover { background: var(--pale); }
.btn.petit { padding: 8px 14px; font-size: 14px; }
.btn.danger { background: var(--blanc); color: var(--rouge); border-color: var(--rouge); }
.btn.danger:hover { background: var(--rouge-p); }
.btn.vert { background: var(--vert); border-color: var(--vert); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn .fl { transition: transform .2s; } .btn:hover .fl { transform: translateX(4px); }
.lien { background: none; border: none; padding: 0; color: var(--encre); text-decoration: underline; cursor: pointer; font: 14px var(--police); }

/* Communs */
.ariane { font-size: 13px; color: var(--gris); padding: 18px 0 6px; }
.ariane a { color: var(--gris); text-decoration: none; } .ariane a:hover { text-decoration: underline; }
.tag { display: inline-block; background: var(--pale); color: var(--marine); font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; }
.carte { background: var(--blanc); border: 1px solid var(--marine); border-top: 4px solid var(--marine); padding: 22px 22px 18px; transition: transform .25s, box-shadow .25s; }
.carte:hover { transform: translateY(-3px); box-shadow: var(--ombre); }
.carte h3 { display: flex; align-items: center; gap: 10px; font-size: 17px; }
.pastille { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--marine); color: var(--blanc); font-size: 13px; font-weight: 700; }
.pastille.vide { background: var(--blanc); color: var(--marine); border: 2px solid var(--marine); }
.grille3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grille4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.section { padding: 48px 0; }
.section.fond { background: var(--fond); }
.info { display: flex; gap: 12px; align-items: flex-start; background: var(--pale); padding: 14px 16px; font-size: 14px; }
.info .i { flex: none; width: 22px; height: 22px; border: 2px solid var(--marine); border-radius: 50%; display: grid; place-items: center; color: var(--marine); font-weight: 700; font-size: 12px; }
.muted { color: var(--gris); }
.petit-texte { font-size: 13px; }

/* Pied */
.pied { background: var(--marine); color: var(--blanc); margin-top: 0; }
.pied .conteneur { display: flex; justify-content: space-between; gap: 20px; padding-top: 22px; padding-bottom: 22px; font-size: 13.5px; flex-wrap: wrap; }
.pied a { color: var(--blanc); text-decoration: none; margin-right: 6px; }
.pied a:hover { text-decoration: underline; }

/* Transitions de vue */
#vue { min-height: calc(100vh - 76px - 66px); }
.vue-in { animation: entree .45s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes entree { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.rev { opacity: 0; transform: translateY(18px); transition: opacity .6s, transform .6s cubic-bezier(.2, .7, .2, 1); }
.rev.vu { opacity: 1; transform: none; }

/* Accueil */
.hero { display: grid; grid-template-columns: 1.25fr 1fr; gap: 40px; align-items: center; padding: 10px 0 44px; }
.hero h1 { font-size: 46px; }
.hero p.chapo { font-size: 18px; max-width: 560px; }
.hero .actions { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 22px; }
.hero-visu { border: 1px solid var(--trait); background: var(--blanc); display: grid; place-items: center; padding: 28px; position: relative; overflow: hidden; }
.hero-visu img { width: 290px; animation: tampon 1s .2s cubic-bezier(.2, 1.4, .3, 1) both; }
@keyframes tampon { from { opacity: 0; transform: scale(1.5) rotate(-14deg); } to { opacity: 1; transform: none; } }
.chiffres { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--trait-c); border-bottom: 1px solid var(--trait-c); }
.chiffres div { padding: 22px 20px; border-right: 1px solid var(--trait-c); }
.chiffres div:last-child { border: none; }
.chiffres b { display: block; font-size: 32px; color: var(--marine); }
.chiffres span { font-size: 13.5px; color: var(--gris); }
.etapes-h { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 18px; }
.etapes-h::before { content: ""; position: absolute; left: 14px; right: 25%; top: 14px; height: 2px; background: var(--marine); transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform 1.2s cubic-bezier(.2, .7, .2, 1); }
.etapes-h > div { position: relative; }
.etapes-h b { display: block; color: var(--marine); margin-top: 12px; font-size: 15px; }
.etapes-h span { font-size: 13.5px; color: var(--gris); }
.etapes-h .pastille { position: relative; z-index: 1; }

/* Galerie */
.galerie { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 22px; }
.oeuvre-c { border: 1px solid var(--trait-c); background: var(--blanc); text-decoration: none; color: var(--encre); display: block; transition: transform .25s, box-shadow .25s, border-color .25s; }
.oeuvre-c:hover { transform: translateY(-4px); box-shadow: var(--ombre); border-color: var(--marine); }
.vignette { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--fond); }
.vignette img, .vignette svg { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
.oeuvre-c:hover .vignette img, .oeuvre-c:hover .vignette svg { transform: scale(1.04); }
.vignette .mini-sceau { position: absolute; right: 8px; bottom: 8px; width: 40px; height: 40px; border-radius: 50%; background: var(--blanc); box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.oeuvre-c .txt { padding: 12px 14px 14px; }
.oeuvre-c b { display: block; color: var(--marine); font-size: 15px; }
.oeuvre-c small { color: var(--gris); font-size: 13px; }
.filtres { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin: 6px 0 24px; }
.filtres .champ { margin: 0; }
.vide-msg { padding: 40px; text-align: center; color: var(--gris); border: 1px dashed var(--trait); }

/* Formulaires */
.champ { margin-bottom: 18px; }
.champ label, .champ .lab { display: block; font-weight: 700; font-size: 14.5px; margin-bottom: 6px; }
.champ .aide { display: block; font-size: 13px; color: var(--gris); font-weight: 400; margin: -2px 0 6px; }
input[type=text], input[type=email], input[type=number], input[type=password], input[type=search], select, textarea {
  width: 100%; padding: 11px 12px; font: 15px var(--police); color: var(--encre); background: var(--blanc);
  border: 1px solid var(--encre); border-radius: 0; transition: border-color .2s, box-shadow .2s; }
textarea { min-height: 120px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--marine); box-shadow: 0 0 0 3px rgba(2, 52, 129, .18); }
.champ.erreur input, .champ.erreur textarea, .champ.erreur select { border-color: var(--rouge); }
.champ .msg-err { display: none; color: var(--rouge); font-size: 13px; margin-top: 6px; }
.champ.erreur .msg-err { display: block; }
.radios label { display: flex; align-items: center; gap: 10px; font-weight: 400; padding: 7px 0; cursor: pointer; }
input[type=radio], input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--marine); margin: 0; }
.ligne-h { display: grid; grid-template-columns: 1fr 120px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--trait-c); }
.ligne-h label { margin: 0; font-weight: 400; }
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

/* Dépôt */
.depot { display: grid; grid-template-columns: 1fr 340px; gap: 40px; align-items: start; padding-bottom: 56px; }
.progression { margin: 6px 0 26px; }
.progression .num { font-size: 13px; color: var(--gris); font-weight: 700; }
.progression h1 { font-size: 30px; margin: 4px 0 12px; }
.barres { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.barres span { height: 6px; background: var(--pale); position: relative; overflow: hidden; }
.barres span i { position: absolute; inset: 0; background: var(--marine); transform-origin: left; transform: scaleX(0); transition: transform .5s cubic-bezier(.2, .7, .2, 1); }
.barres span.ok i { transform: scaleX(1); }
.progression .suiv { font-size: 13px; color: var(--gris); font-style: italic; margin-top: 8px; }
.panneau { border: 1px solid var(--trait-c); padding: 28px; background: var(--blanc); }
.nav-etapes { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
.nav-etapes .g { display: flex; gap: 12px; }
.cote { position: sticky; top: 100px; }
.cote .bloc { border: 1px solid var(--marine); border-top: 4px solid var(--marine); padding: 18px; margin-bottom: 16px; }
.cote ul { list-style: none; margin: 0; padding: 0; }
.cote li { display: flex; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; color: var(--gris); }
.cote li .ck { flex: none; width: 18px; height: 18px; border: 1.5px solid var(--encre); display: grid; place-items: center; font-size: 12px; transition: background .2s; }
.cote li.ok { color: var(--encre); }
.cote li.ok .ck { background: var(--marine); border-color: var(--marine); color: var(--blanc); }
.cote li.cur { color: var(--marine); font-weight: 700; }
.depose { border: 1.5px dashed var(--marine); background: var(--pale); padding: 26px; text-align: center; cursor: pointer; transition: background .2s, transform .2s; }
.depose:hover, .depose.survol { background: #DCE6F6; }
.depose.survol { transform: scale(1.01); }
.depose b { color: var(--marine); }
.depose small { display: block; color: var(--gris); margin-top: 4px; }
.apercu { display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center; border: 1px solid var(--trait-c); padding: 12px; margin-top: 12px; animation: entree .35s both; }
.apercu img { width: 140px; height: 100px; object-fit: cover; }
.fichiers { list-style: none; margin: 10px 0 0; padding: 0; }
.fichiers li { display: flex; justify-content: space-between; padding: 8px 10px; border: 1px solid var(--trait-c); margin-top: 6px; font-size: 14px; animation: entree .3s both; }
.dosage { margin: 18px 0 6px; }
.dosage .barre { display: flex; height: 12px; background: var(--pale); overflow: hidden; }
.dosage .barre span { transition: width .5s cubic-bezier(.2, .7, .2, 1); }
.dosage .h { background: var(--marine); } .dosage .ia { background: #2E6BFF; }
.dosage .leg { display: flex; justify-content: space-between; font-size: 13px; color: var(--gris); margin-top: 6px; }
.verdict { margin-top: 12px; padding: 12px 14px; font-size: 14px; border-left: 4px solid; transition: background .3s, border-color .3s; }
.verdict.ok { background: var(--vert-p); border-color: var(--vert); color: #0E4F27; }
.verdict.ko { background: var(--rouge-p); border-color: var(--rouge); color: #8A1014; }
table.devis { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-top: 8px; }
table.devis td, table.devis th { padding: 10px 6px; border-bottom: 1px solid var(--trait-c); text-align: left; }
table.devis td:last-child, table.devis th:last-child { text-align: right; }
table.devis tr.tot td { font-weight: 700; font-size: 16px; border-bottom: 2px solid var(--marine); color: var(--marine); }
.formules { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.formule { border: 1.5px solid var(--trait); padding: 16px; cursor: pointer; transition: border-color .2s, background .2s; display: block; }
.formule:has(input:checked) { border-color: var(--marine); background: var(--pale); }
.formule input { float: right; }
.formule b { display: block; color: var(--marine); font-size: 22px; margin: 4px 0; }
.recap dt { font-size: 13px; color: var(--gris); } .recap dd { margin: 0 0 10px; font-weight: 700; }

/* Paiement / chargement */
.voile { position: fixed; inset: 0; background: rgba(31, 37, 48, .55); display: grid; place-items: center; z-index: 80; animation: fondu .25s both; }
@keyframes fondu { from { opacity: 0; } }
.boite { background: var(--blanc); padding: 32px; width: min(440px, 92vw); text-align: center; border-top: 4px solid var(--marine); animation: entree .35s both; }
.rond { width: 54px; height: 54px; border: 4px solid var(--pale); border-top-color: var(--marine); border-radius: 50%; margin: 6px auto 16px; animation: tourne .8s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }

/* Confirmation / suivi */
.etroit { max-width: 720px; margin: 0 auto; padding-bottom: 56px; }
.succes { display: flex; gap: 16px; align-items: center; border: 1px solid var(--marine); border-left: 5px solid var(--marine); padding: 18px 20px; margin: 10px 0 24px; }
.check { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--marine); display: grid; place-items: center; animation: pop .5s .1s cubic-bezier(.2, 1.6, .3, 1) both; }
.check svg { width: 22px; stroke: #fff; stroke-width: 3; fill: none; stroke-dasharray: 30; stroke-dashoffset: 30; animation: trace .45s .45s forwards; }
@keyframes pop { from { transform: scale(0); } }
@keyframes trace { to { stroke-dashoffset: 0; } }
.numero { background: var(--pale); text-align: center; font-size: 24px; font-weight: 700; color: var(--marine); padding: 14px; letter-spacing: .04em; }
.frise { list-style: none; padding: 0; margin: 12px 0 24px; }
.frise li { position: relative; padding: 0 0 22px 40px; }
.frise li::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: 0; width: 2px; background: var(--trait); }
.frise li:last-child::before { display: none; }
.frise li.fait::before { background: var(--marine); }
.frise .pt { position: absolute; left: 0; top: 2px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--encre); background: var(--blanc); transition: background .4s, border-color .4s; display: grid; place-items: center; }
.frise li.fait .pt { background: var(--marine); border-color: var(--marine); }
.frise li.fait .pt::after { content: "✓"; color: #fff; font-size: 12px; font-weight: 700; }
.frise li.cours .pt { border-color: var(--marine); box-shadow: 0 0 0 0 rgba(2, 52, 129, .45); animation: pulse 1.6s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(2, 52, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(2, 52, 129, 0); } }
.frise b { display: block; } .frise small { color: var(--gris); }
.pile { display: grid; gap: 10px; }
.pile .btn { justify-content: center; }

/* Fiche œuvre */
.fiche { display: grid; grid-template-columns: 1.2fr 1fr; gap: 36px; align-items: start; padding-bottom: 56px; }
.cadre { border: 1px solid var(--trait-c); background: var(--blanc); }
.cadre .art { aspect-ratio: auto; background: var(--fond); }
.cadre .art img, .cadre .art svg { display: block; width: 100%; height: auto; }
.cartel { display: grid; grid-template-columns: 76px 1fr 86px; gap: 16px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--trait-c); }
.cartel img.s { width: 76px; border-radius: 50%; }
.cartel .qr svg { width: 86px; height: 86px; display: block; }
.cartel b { color: var(--marine); }
.cartel small { color: var(--gris); display: block; font-size: 13px; }
.certificat { border: 1.5px solid var(--marine); padding: 26px; position: relative; background: var(--blanc); }
.certificat .ent { display: flex; gap: 14px; align-items: center; border-bottom: 1px solid var(--trait-c); padding-bottom: 14px; margin-bottom: 14px; }
.certificat .ent img { width: 64px; border-radius: 50%; animation: tampon .9s .15s cubic-bezier(.2, 1.4, .3, 1) both; }
.certificat dl { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; margin: 0; font-size: 14.5px; }
.certificat dt { color: var(--gris); } .certificat dd { margin: 0; font-weight: 700; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 8px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.b-certifiee { background: var(--vert-p); color: var(--vert); }
.b-refusee { background: var(--rouge-p); color: var(--rouge); }
.b-analyse, .b-deposee { background: var(--pale); color: var(--marine); }
.b-commission { background: var(--orange-p); color: var(--orange); }

/* Vérifier */
.verif-form { display: flex; gap: 12px; max-width: 640px; }
.verif-form input { font-size: 18px; letter-spacing: .04em; }
.resultat-v { margin-top: 24px; max-width: 760px; animation: entree .4s both; }
.res-ok { display: grid; grid-template-columns: 160px 1fr; gap: 20px; border: 1px solid var(--vert); border-left: 5px solid var(--vert); padding: 16px; }
.res-ok .vignette { aspect-ratio: 4/3; }
.res-ko { border: 1px solid var(--rouge); border-left: 5px solid var(--rouge); padding: 16px 18px; }
.res-att { border: 1px solid var(--orange); border-left: 5px solid var(--orange); padding: 16px 18px; }
.exemples { margin-top: 14px; font-size: 14px; color: var(--gris); }
.exemples button { background: var(--pale); border: none; color: var(--marine); font: 700 13px var(--police); padding: 4px 8px; margin: 0 4px 4px 0; cursor: pointer; }

/* FAQ */
details { border-bottom: 1px solid var(--trait-c); padding: 4px 0; }
summary { cursor: pointer; padding: 14px 0; font-weight: 700; color: var(--marine); list-style: none; display: flex; justify-content: space-between; }
summary::after { content: "+"; font-size: 22px; line-height: 1; transition: transform .25s; }
details[open] summary::after { transform: rotate(45deg); }
details p { animation: entree .3s both; }

/* Espace pro */
.pro-bandeau { background: var(--marine); color: var(--blanc); }
.pro-bandeau .conteneur { display: flex; align-items: center; justify-content: space-between; height: 54px; font-size: 14px; }
.pro-bandeau a, .pro-bandeau button { color: var(--blanc); }
.pro-onglets { display: flex; gap: 2px; }
.pro-onglets button { background: transparent; border: none; color: #C9D6EE; padding: 16px 16px; font: 700 14px var(--police); cursor: pointer; border-bottom: 3px solid transparent; }
.pro-onglets button.actif { color: var(--blanc); border-bottom-color: var(--blanc); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin: 26px 0; }
.kpi { border: 1px solid var(--trait-c); border-top: 4px solid var(--marine); padding: 18px; background: var(--blanc); }
.kpi b { display: block; font-size: 30px; color: var(--marine); }
.kpi span { font-size: 13.5px; color: var(--gris); }
.pro-grille { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-bottom: 26px; }
.boite-pro { border: 1px solid var(--trait-c); background: var(--blanc); padding: 20px; }
.histo { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding-top: 10px; }
.histo div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.histo i { display: block; width: 100%; background: var(--marine); transform-origin: bottom; animation: monte .8s cubic-bezier(.2, .7, .2, 1) both; min-height: 2px; }
.histo i:hover { background: #2E6BFF; }
.histo span { font-size: 12px; color: var(--gris); }
.histo em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--marine); }
@keyframes monte { from { transform: scaleY(0); } }
.repart div { display: grid; grid-template-columns: 130px 1fr 34px; gap: 10px; align-items: center; font-size: 13.5px; margin-bottom: 10px; }
.repart .jauge { height: 10px; background: var(--pale); }
.repart .jauge i { display: block; height: 100%; background: var(--marine); animation: large 1s cubic-bezier(.2, .7, .2, 1) both; transform-origin: left; }
@keyframes large { from { transform: scaleX(0); } }
.outils { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.outils input[type=search] { max-width: 280px; }
.outils select { width: auto; }
.outils .esp { flex: 1; }
.table-env { border: 1px solid var(--trait-c); overflow-x: auto; background: var(--blanc); }
table.bdd { width: 100%; border-collapse: collapse; font-size: 14px; }
table.bdd th { text-align: left; background: var(--fond); color: var(--marine); font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; padding: 12px; border-bottom: 2px solid var(--marine); cursor: pointer; user-select: none; white-space: nowrap; }
table.bdd th .tri { opacity: .35; margin-left: 4px; }
table.bdd th.trie .tri { opacity: 1; }
table.bdd td { padding: 10px 12px; border-bottom: 1px solid var(--trait-c); vertical-align: middle; }
table.bdd tbody tr { cursor: pointer; transition: background .15s; animation: entree .35s both; }
table.bdd tbody tr:hover { background: var(--pale); }
.t-oeuvre { display: flex; gap: 10px; align-items: center; }
.t-oeuvre .mini { width: 48px; height: 36px; flex: none; overflow: hidden; background: var(--fond); }
.t-oeuvre .mini img, .t-oeuvre .mini svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.mono { font-family: "Courier New", monospace; font-size: 13px; }
.pagination { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-size: 13.5px; color: var(--gris); }
.pagination .g { display: flex; gap: 6px; }
.tiroir-fond { position: fixed; inset: 0; background: rgba(31, 37, 48, .4); z-index: 60; animation: fondu .25s both; }
.tiroir { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 96vw); background: var(--blanc); z-index: 61; overflow-y: auto; box-shadow: -10px 0 40px rgba(0,0,0,.18); animation: glisse .35s cubic-bezier(.2, .7, .2, 1) both; border-left: 4px solid var(--marine); }
@keyframes glisse { from { transform: translateX(100%); } }
.tiroir .t-ent { position: sticky; top: 0; background: var(--blanc); display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--trait-c); z-index: 1; }
.tiroir .t-corps { padding: 22px; }
.fermer { background: none; border: 1.5px solid var(--marine); color: var(--marine); width: 34px; height: 34px; cursor: pointer; font-size: 18px; }
.connexion { max-width: 440px; margin: 40px auto 60px; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--encre); color: var(--blanc); padding: 12px 18px; font-size: 14.5px; z-index: 90; animation: toast 3s both; border-left: 4px solid #2E6BFF; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 16px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 8px); } }

@media (max-width: 1200px) {
  .nav { display: none; position: absolute; top: 76px; left: 0; right: 0; background: var(--blanc); flex-direction: column; align-items: stretch; border-bottom: 3px solid var(--marine); padding: 8px 16px 16px; }

  .nav .pro { border: none; margin: 0; }
  .menu-btn { display: block; }
  .nav a.btn { margin: 8px 0 0 !important; justify-content: center; }
}
@media (max-width: 960px) {
  .hero, .depot, .fiche, .pro-grille { grid-template-columns: 1fr; }
  .grille3, .grille4, .kpis, .chiffres, .etapes-h { grid-template-columns: 1fr 1fr; }

  .cote { position: static; }
  h1, .hero h1 { font-size: 32px; }
  .conteneur { padding: 0 16px; }
}
@media (max-width: 560px) {
  .grille3, .grille4, .kpis, .chiffres, .etapes-h, .deux, .formules { grid-template-columns: 1fr; }

  .marque small { display: none; }
}

}
@media print {
  body * { visibility: hidden; }
  #impression, #impression * { visibility: visible; }
  #impression { position: absolute; inset: 0; padding: 30px; }
}

      <div class="dosage"><div class="barre"><span class="h" style="width:${100 - ia}%"></span><span class="ia" style="width:${ia}%"></span></div><div class="leg"><span>Humain ${100 - ia} %</span><span>Exécution IA ${ia} %</span></div>

      <h4 style="margin-top:16px">Justificatifs</h4><ul class="fichiers">${o.justificatifs.map(n => `<li><span>📄 ${esc(n)}</span><span class="muted">Reçu</span></li>`).join("")}</ul>
      ${o.motif ? `<div class="res-ko" style="margin-top:14px"><b>Motif du refus</b><p style="margin:6px 0 0">${esc(o.motif)}</p></div>` : ""}
      ${o.statut === "commission" ? `<div class="champ" style="margin-top:16px"><label for="motif">Motif en cas de refus</label><textarea id="motif" style="min-height:70px">${ia > SEUIL ? "Part d'exécution par IA supérieure au seuil du référentiel." : ""}</textarea></div>` : ""}
      <div class="pile" style="margin-top:18px">${actions.map(([s, l, c]) => `<button class="btn ${c}" data-s="${s}">${l}</button>`).join("")}${o.statut === "certifiee" ? `<a class="btn sec" href="#/oeuvre/${o.id}">Voir la page publique</a>` : ""}</div>
    </div>`;
  document.body.append(fond, t);
  const fermer = () => { t.remove(); fond.remove(); document.removeEventListener("keydown", esc_); };
  const esc_ = e => { if (e.key === "Escape") fermer(); };
  document.addEventListener("keydown", esc_); fond.onclick = fermer; $(".fermer", t).onclick = fermer; $(".fermer", t).focus();
  $$("[data-s]", t).forEach(b => b.onclick = () => {
    const s = b.dataset.s, ch = { statut: s };
    if (s === "refusee") { const m = $("#motif", t).value.trim(); if (!m) { $("#motif", t).closest(".champ").classList.add("erreur"); return toast("Indiquez le motif du refus."); } ch.motif = m; }
    if (s === "certifiee") ch.date = new Date().toISOString();
    DB.maj(o.id, ch); fermer(); apres(); toast(s === "certifiee" ? "Œuvre certifiée et publiée au registre." : s === "refusee" ? "Dossier refusé." : "Dossier mis à jour.");
  });
}

/* ---------- Animations ---------- */
let obs;
function revele() {
  if (!obs) obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("vu"); obs.unobserve(e.target); if (e.target.id === "etapes-h") e.target.style.setProperty("--p", 1); } }), { threshold: .12 });
  $$(".rev:not(.vu)").forEach((el, i) => { el.style.transitionDelay = (i % 6) * 70 + "ms"; obs.observe(el); });
}
function compteurs() {
  $$("[data-compte]").forEach(el => {
    const fin = +el.dataset.compte, suf = el.dataset.suffixe || "", t0 = performance.now(), d = 1100;
    const pas = t => { const k = Math.min(1, (t - t0) / d), v = Math.round(fin * (1 - Math.pow(1 - k, 3))); el.textContent = v.toLocaleString("fr-FR") + suf; if (k < 1) requestAnimationFrame(pas); };
    requestAnimationFrame(pas);
  });
}

/* ---------- Routeur ---------- */
const ROUTES = [
  [/^\/$/, () => [vueAccueil()]], [/^\/createurs$/, () => [vueCreateurs()]], [/^\/clients$/, () => [vueClients()]], [/^\/faq$/, () => [vueFaq()]],
  [/^\/registre$/, () => [vueRegistre(), initRegistre]], [/^\/verifier(?:\/(.+))?$/, m => [vueVerifier(m[1] && decodeURIComponent(m[1])), () => initVerifier(m[1] && decodeURIComponent(m[1]))]],
  [/^\/oeuvre\/(.+)$/, m => [vueOeuvre(m[1]), () => initOeuvre(m[1])]], [/^\/depot$/, () => [vueDepot(), initDepot]],
  [/^\/confirmation\/(.+)$/, m => [vueConfirmation(m[1]), () => initConfirmation(m[1])]], [/^\/suivi(?:\/(.+))?$/, m => [vueSuivi(m[1]), () => initSuivi(m[1])]],
  [/^\/pro$/, () => [vuePro(), initPro]],
];
let routePrec = "";
function rendre() {
  const route = (location.hash.slice(1) || "/").split("?")[0];
  entete(route);
  let html = null, init = null;
  for (const [re, f] of ROUTES) { const m = route.match(re); if (m) { [html, init] = f(m); break; } }
  if (html === null) [html, init] = [vueAccueil()];
  const v = $("#vue"); v.classList.remove("vue-in"); void v.offsetWidth; v.innerHTML = html; v.classList.add("vue-in");
  if (route !== routePrec) { scrollTo({ top: 0, behavior: "instant" }); v.focus({ preventScroll: true }); }
  routePrec = route;
  if (init) init();
  revele(); compteurs();
}
DB.charger(); DB.sauver();
addEventListener("hashchange", rendre);
rendre();
</script>
